# =============================================================================
# ONE-TIME: switch GitHub Pages on.
#
# Plain English: everything is committed to main, but until Pages is switched
# on GitHub serves nothing and every address returns "404 not found". This
# turns it on and points it at main / root.
#
# You only ever need to run this once. After that GitHub rebuilds the site by
# itself every time the wire commits.
#
# It can also be done by hand, and that is just as good:
#   Settings -> Pages -> Source: "Deploy from a branch" -> main -> / (root)
# =============================================================================
name: Enable GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Turn Pages on, pointing at main / root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          echo "Current Pages status:"
          gh api "repos/${{ github.repository }}/pages" 2>&1 | head -5 || true

          echo
          echo "Enabling Pages on main / root ..."
          if gh api --method POST "repos/${{ github.repository }}/pages" \
               -f "source[branch]=main" -f "source[path]=/" 2>&1 | tee /tmp/out; then
            echo "Pages enabled."
          else
            # Already enabled is not an error — make sure it points at main/root.
            if grep -qi "already exists" /tmp/out; then
              echo "Pages already existed; updating its source to main / root."
              gh api --method PUT "repos/${{ github.repository }}/pages" \
                -f "source[branch]=main" -f "source[path]=/"
            else
              echo "Could not enable Pages automatically. Do it by hand:"
              echo "  Settings -> Pages -> Deploy from a branch -> main -> / (root)"
              exit 1
            fi
          fi

      - name: Show the result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api "repos/${{ github.repository }}/pages" 2>&1 | head -20 || true
